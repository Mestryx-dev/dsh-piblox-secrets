- insert:
    - id: dsh-piblox-secrets
      name: 'dsh-piblox-secrets'
      config:
        storeBackend: embedded
        exposeTools: true
        exposeSecretsGetTool: false
        allowBreakGlassPlaintext: false
        allowProcessEnvMaterialize: false
        uiEnabled: true
        degradedMode: tools-error
        bootHosts:
          - '*'
